<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataProcessing - Excel 转 CSV</title>
    <link rel="stylesheet" href="styles.css?v=20260318g">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-row">
          <div class="hero-main">
            <p class="eyebrow">DataProcessing</p>
            <h1 id="page-title">DataDownload 控制台</h1>
            <p id="hero-status" class="subhead"></p>
          </div>
          <div class="hero-actions">
            <button id="run-all" type="button" class="action-btn">全部运行</button>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="tabs" role="tablist" aria-label="数据处理面板">
          <button id="tab-download" class="tab active" type="button" role="tab" aria-selected="true">DataDownload</button>
          <button id="tab-erp" class="tab" type="button" role="tab" aria-selected="false">ERP</button>
          <button id="tab-thermo" class="tab" type="button" role="tab" aria-selected="false">市场温度计</button>
        </div>

        <div id="panel-download" class="panel-body">
          <div class="download-header">
            <div class="download-actions">
              <button id="download-run-all" type="button" class="action-btn">手动下载（全部）</button>
            </div>
            <div class="download-status">
              <span id="download-global-status" class="status-chip">待机</span>
              <span class="download-note">需要扫码登录时会弹出浏览器窗口。</span>
            </div>
          </div>

          <div id="download-task-table" class="download-table">
            <div class="download-row header">
              <div class="cell checkbox"></div>
              <div class="cell name">名称</div>
              <div class="cell url">URL</div>
              <div class="cell status">状态</div>
            </div>
          </div>

          <div class="download-summary">
            <p class="download-summary-title">运行摘要</p>
            <p id="download-run-summary" class="download-summary-body">暂无运行记录。</p>
          </div>
        </div>

        <div id="panel-erp" class="panel-body hidden">
          <div class="erp-grid">
            <div class="erp-col">
              <button id="erp" type="button" class="action-btn">导出完整周期 ERP</button>
            </div>

            <div class="erp-col">
              <button id="rolling" type="button" class="action-btn">导出滚动周期 ERP</button>
              <div class="control">
                <label for="rolling-n">滚动周期 n（交易日）</label>
                <div class="select-wrap">
                  <input id="rolling-n" type="number" inputmode="numeric" min="1" max="4000" step="1" value="2400" />
                </div>
              </div>
            </div>

            <div class="erp-col">
              <button id="interval" type="button" class="action-btn">导出指定周期 ERP</button>
              <div class="control">
                <label for="interval-start">固定区间起始日期（YYYY-MM-DD）</label>
                <div class="select-wrap">
                  <input id="interval-start" type="date" value="2014-01-02" />
                </div>
              </div>
              <div class="control">
                <label for="interval-end">固定区间终止日期（YYYY-MM-DD）</label>
                <div class="select-wrap">
                  <input id="interval-end" type="date" />
                </div>
              </div>
            </div>
          </div>

          <div class="status-row">
            <span id="status" class="status" aria-live="polite"></span>
          </div>

          <div class="hint">
            <p class="hint-title">说明</p>
            <p class="hint-body">滚动周期用于计算滚动时间窗口内的动态布林带（±1σ、±2σ）；固定区间用于计算“起始日期→终止日期”的水平布林线。</p>
            <p class="hint-body">输出：<span class="path">ERP.csv</span>、<span class="path">ERP_Rolling Calculation.csv</span>、<span class="path">ERP_Interval.csv</span>。</p>
          </div>

          <div class="control">
            <label>可选导出列</label>
            <div class="checks">
              <label class="check"><input id="erp-col-yield" type="checkbox">十年国债收益率</label>
              <label class="check"><input id="erp-col-pe" type="checkbox">PE-TTM-S</label>
              <label class="check"><input id="erp-col-erp-pct" type="checkbox">股权风险溢价分位</label>
            </div>
          </div>
        </div>

        <div id="panel-thermo" class="panel-body hidden">
          <div class="actions thermo-actions">
            <button id="thermo-percentile" type="button" class="action-btn">导出市场温度计分位数据</button>
            <button id="thermo-merge" type="button" class="action-btn">导出市场温度计总表</button>
            <div class="status-row">
              <span id="thermo-status" class="status" aria-live="polite"></span>
            </div>
          </div>
          <div class="diagnostic">
            <label class="check"><input id="window-size-toggle" type="checkbox">滚动诊断：输出滚动周期长度</label>
          </div>

          <div class="thermo-stack">
            <div class="thermo-factor-grid">
              <div class="control">
                <label for="ma-gdp">总市值/GDP平均移动（周频）</label>
                <div class="select-wrap">
                  <input id="ma-gdp" type="number" min="1" max="1000" step="1" value="1" />
                </div>
              </div>
              <div class="control">
                <label for="rp-gdp">总市值/GDP分位滚动周期（周频）</label>
                <div class="select-wrap">
                  <input id="rp-gdp" type="number" min="1" max="1000" step="1" value="500" />
                </div>
              </div>
              <div class="control">
                <label for="internal-gdp">总市值/GDP最小递减滚动周期（周频）</label>
                <div class="select-wrap select-duo">
                  <select id="internal-gdp-mode">
                    <option value="auto" selected>自动</option>
                    <option value="custom">自定义</option>
                  </select>
                  <input id="internal-gdp" type="number" min="1" max="1000" step="1" value="500" />
                </div>
              </div>
              <div class="control">
                <label for="w-gdp">权重：市值/GDP（%）</label>
                <div class="select-wrap">
                  <input id="w-gdp" type="number" min="0" max="100" step="1" value="34" />
                </div>
              </div>

              <div class="control">
                <label for="ma-volume">成交量平均移动</label>
                <div class="select-wrap">
                  <input id="ma-volume" type="number" min="1" max="4000" step="1" value="20" />
                </div>
              </div>
              <div class="control">
                <label for="rp-volume">成交量/总市值分位滚动周期</label>
                <div class="select-wrap">
                  <input id="rp-volume" type="number" min="1" max="4000" step="1" value="1000" />
                </div>
              </div>
              <div class="control">
                <label for="internal-volume">成交量/总市值最小递减滚动周期</label>
                <div class="select-wrap select-duo">
                  <select id="internal-volume-mode">
                    <option value="auto" selected>自动</option>
                    <option value="custom">自定义</option>
                  </select>
                  <input id="internal-volume" type="number" min="1" max="4000" step="1" value="1000" />
                </div>
              </div>
              <div class="control">
                <label for="w-volume">权重：成交量/市值（%）</label>
                <div class="select-wrap">
                  <input id="w-volume" type="number" min="0" max="100" step="1" value="33" />
                </div>
              </div>

              <div class="control">
                <label for="ma-securities">融资融券平均移动</label>
                <div class="select-wrap">
                  <input id="ma-securities" type="number" min="1" max="4000" step="1" value="1" />
                </div>
              </div>
              <div class="control">
                <label for="rp-securities">融资融券/总市值分位滚动周期</label>
                <div class="select-wrap">
                  <input id="rp-securities" type="number" min="1" max="4000" step="1" value="1000" />
                </div>
              </div>
              <div class="control">
                <label for="internal-securities">融资融券/总市值最小递减滚动周期</label>
                <div class="select-wrap select-duo">
                  <select id="internal-securities-mode">
                    <option value="auto" selected>自动</option>
                    <option value="custom">自定义</option>
                  </select>
                  <input id="internal-securities" type="number" min="1" max="4000" step="1" value="1000" />
                </div>
              </div>
              <div class="control">
                <label for="w-securities">权重：融资融券/市值（%）</label>
                <div class="select-wrap">
                  <input id="w-securities" type="number" min="0" max="100" step="1" value="33" />
                </div>
              </div>

              <div class="control">
                <label for="ma-erp">股权风险溢价平均移动</label>
                <div class="select-wrap">
                  <input id="ma-erp" type="number" min="1" max="4000" step="1" value="1" />
                </div>
              </div>
              <div class="control">
                <label for="rp-erp">股权风险溢价分位滚动周期</label>
                <div class="select-wrap">
                  <input id="rp-erp" type="number" min="1" max="4000" step="1" value="2400" />
                </div>
              </div>
              <div class="control">
                <label for="internal-erp">股权风险溢价最小递减滚动周期</label>
                <div class="select-wrap select-duo">
                  <select id="internal-erp-mode">
                    <option value="auto">自动</option>
                    <option value="custom" selected>自定义</option>
                  </select>
                  <input id="internal-erp" type="number" min="1" max="4000" step="1" value="2000" />
                </div>
              </div>
              <div class="control">
                <label for="w-erp">权重：股权风险溢价分位（%）</label>
                <div class="select-wrap">
                  <input id="w-erp" type="number" min="0" max="100" step="1" value="0" />
                </div>
              </div>
            </div>

            <div class="control">
              <label>可选导出列</label>
              <div class="checks">
              <label class="check"><input id="col-gdp" type="checkbox">市值/GDP分位</label>
              <label class="check"><input id="col-volume" type="checkbox">成交量/市值分位</label>
              <label class="check"><input id="col-securities" type="checkbox">融资融券/市值分位</label>
              <label class="check"><input id="col-erp" type="checkbox">股权风险溢价</label>
              <label class="check"><input id="col-yield" type="checkbox">十年国债收益率</label>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <button id="modal-close" type="button" class="primary">知道了</button>
      </div>
    </div>

    <script src="app.js?v=20260318g"></script>
  </body>
</html>
